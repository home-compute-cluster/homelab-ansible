---
k3s_role: server

# k3s_bootstrap_complete and k3s_api_endpoint live in all.yaml — agents need
# them as much as servers do.

k3s_tls_sans:
  - "{{ k3s_vip }}"
  - "{{ ansible_host }}"
  - "{{ inventory_hostname }}"
  - "{{ inventory_hostname }}.{{ lan_domain }}"

# Garage runs in the Docker Compose stack on nebula, not in the cluster.
# Addressed via the inventory rather than nebula.{{ lan_domain }}, which does
# not resolve — an unresolvable endpoint means every snapshot fails and the
# only symptom is a line in the k3s log.
etcd_s3_endpoint: "{{ hostvars['nebula'].ansible_host }}:3900"
etcd_s3_bucket: k3s-etcd
# Read from the live endpoint 2026-08-30: an anonymous request to
# http://192.168.1.248:3900/ returns <Region>us-east-1</Region>. SigV4 signs
# over the region, so signing with anything else fails the bucket-existence
# check with 400 Bad Request rather than a useful message. "garage" was a
# guess about Garage's default; this instance does not use it.
etcd_s3_region: us-east-1

# Garage on :3900 speaks plain HTTP (verified: HTTP answers 403, TLS
# handshake fails outright). etcd-s3-insecure is the flag that disables HTTPS;
# etcd-s3-skip-ssl-verify only skips CERTIFICATE VALIDATION and still requires
# HTTPS, so on its own it cannot talk to this endpoint at all.
etcd_s3_insecure: true
etcd_s3_skip_ssl_verify: false
etcd_snapshot_cron: "0 */6 * * *"
etcd_snapshot_retention: 20

kubelet_reserved:
  system_reserved: "cpu=500m,memory=512Mi"
  kube_reserved: "cpu=500m,memory=512Mi"

tailscale_advertise_routes: "{{ lan_cidr }}"

# Deliberate. Tailscale's own HA guidance: subnet routers sharing a route must
# NOT also accept it, or a standby accepts its own advertised prefix from the
# primary and sends traffic for a directly-connected subnet the long way round.
tailscale_accept_routes: false

k3s_service_name: k3s
