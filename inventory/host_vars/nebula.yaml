---
# i7-6700K, 24 GB, GTX 1080. ZFS `tank`, Docker Compose stack, Garage S3.
# Running v1.35.5+k3s1 as of 2026-08-30 — NEWER than the pin. Left alone by
# k3s_allow_downgrade: false.
etcd_data_device: null

k3s_node_labels:
  node-role.kubernetes.io/worker: "true"
  node-role.kubernetes.io/storage: "true"
  role: storage

# Disk added through the Longhorn web UI at a non-default path.
longhorn_enabled: true
longhorn_data_path: /var/lib/longhorn-disk-nvme
longhorn_dedicated_mount: true
longhorn_disk_device: null      # TODO: findmnt -n -o SOURCE --mountpoint /var/lib/longhorn-disk-nvme
