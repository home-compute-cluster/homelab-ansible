---
# HP EliteDesk 800 G4 Mini. BIOS password-locked — see §1 of the runbook.
#
# lsblk, verified 2026-08-30:
#   nvme0n1  238.5G  p1 /boot/efi, p2 /            <- OS, cached NVMe
#   nvme1n1  238.5G  p1 /var/lib/longhorn          <- Longhorn, provisioned by hand
#
# There is no free partition for a dedicated etcd mount, and there does not
# need to be: the root filesystem is already on cached NVMe, which is the only
# thing F7 actually requires. etcd shares the OS disk here, exactly as it does
# on deus. (The design document specified /dev/nvme1n1p2 for this — that
# partition does not exist, and nvme1n1p1 is Longhorn's.)
etcd_data_device: null

k3s_node_labels:
  node-role.kubernetes.io/worker: "true"
  node-type: always-on

# Mounted by hand at Longhorn's default path: the whole second 238.5 GB NVMe.
longhorn_enabled: true
longhorn_data_path: /var/lib/longhorn
longhorn_dedicated_mount: true
longhorn_disk_device: /dev/nvme0n1p1
