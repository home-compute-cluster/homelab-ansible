---
# ONLY on deus. Triggers the one-way sqlite -> etcd migration (Phase 3).
k3s_cluster_init: true

# etcd lives on the OS disk here. deus has no second cached device.
etcd_data_device: null

longhorn_enabled: true             # already a Longhorn node, 64d
# TODO: record the backing device, from `findmnt -o SOURCE --mountpoint
# /var/lib/longhorn`. Until it is set, the role reports what is mounted
# rather than asserting it is the right thing.
longhorn_disk_device: null

# Observed live on 2026-08-30. k3s applies node-label at REGISTRATION ONLY
# (F8), so for already-registered nodes this block is a record of what is
# there, not something a re-run can change. `kubectl label` is the tool for
# changing these after the fact.
k3s_node_labels:
  node-role.kubernetes.io/worker: "true"
  node-type: always-on
  svccontroller.k3s.cattle.io/lbpool: deus
