[defaults]
inventory           = inventory/hosts.yaml
roles_path          = roles
host_key_checking   = True
interpreter_python  = /usr/bin/python3

# NOT `stdout_callback = yaml`. That was community.general.yaml, which was
# removed in community.general 12.0.0 and now aborts every run before it
# starts. The replacement is the built-in default callback with result_format.
stdout_callback     = default
result_format       = yaml

callbacks_enabled   = ansible.posix.profile_tasks
retry_files_enabled = False
vault_identity_list = homelab@~/.ansible/homelab-vault-pass

# Facts are gathered on every play in site.yaml; caching makes a re-run cheap
# and keeps delegate_to tasks from re-gathering.
fact_caching        = jsonfile
fact_caching_connection = .ansible_facts
fact_caching_timeout = 3600

[ssh_connection]
pipelining = True
