---
# Phase 5. Moves the agents off deus:6443 and onto the VIP, one at a time.
#
#   ansible-playbook playbooks/repoint-agents.yaml --limit legion-1
#   ansible-playbook playbooks/repoint-agents.yaml --limit nebula
#
# legion-1 first — the node whose loss matters least.
- name: Repoint agents at the VIP
  hosts: k3s_agents
  become: true
  serial: 1
  gather_facts: true
  any_errors_fatal: true

  pre_tasks:
    # Without this the play is a no-op that looks like a success: the config
    # template still renders deus's address, k3s-agent restarts onto the same
    # endpoint it already had, and the agent is 'repointed' nowhere.
    - name: Assert the bootstrap flag has been flipped
      ansible.builtin.assert:
        that: k3s_bootstrap_complete | bool
        fail_msg: >-
          k3s_bootstrap_complete is still false, so k3s_api_endpoint still
          resolves to {{ groups['k3s_servers'][0] }}. Set it to true in
          inventory/group_vars/all.yaml before repointing agents at the VIP.

    # Repointing an agent at an address nothing answers on takes the agent
    # off the cluster until someone notices.
    - name: Confirm the VIP is serving the API before moving anything to it
      ansible.builtin.wait_for:
        host: "{{ k3s_vip }}"
        port: 6443
        timeout: 60

    - name: Confirm all three etcd members are healthy
      ansible.builtin.import_tasks: tasks/etcd-health-gate.yaml

  roles:
    - k3s_common      # rewrites config.yaml: server -> https://<vip>:6443
    - k3s_agent

  post_tasks:
    - name: Wait for the agent to report Ready again
      ansible.builtin.command: >-
        k3s kubectl wait --for=condition=Ready node/{{ inventory_hostname }} --timeout=300s
      delegate_to: "{{ groups['k3s_servers'][0] }}"
      changed_when: false

    - name: Confirm the agent is actually talking to the VIP
      ansible.builtin.shell: |
        set -o pipefail
        grep -q '{{ k3s_vip }}:6443' /etc/rancher/k3s/config.yaml
      args:
        executable: /bin/bash
      changed_when: false
