---
# Routine OS patching, one node at a time, with the node cordoned and drained
# while it happens.
#
#   ansible-playbook playbooks/node-updates.yaml
#   ansible-playbook playbooks/node-updates.yaml --limit legion-1
- name: Patch the nodes
  hosts: k3s_cluster
  become: true
  serial: 1
  gather_facts: true
  roles:
    - node_updates
