---
# deb822_repository rather than apt_repository: the latter is deprecated and
# goes away in ansible-core 2.25, and it writes a one-line sources file that
# is far easier to get subtly wrong.
# tailscale.com/install.sh writes the OLD one-line format to
# sources.list.d/tailscale.list. Leaving it next to the deb822 .sources file
# below gives apt two definitions of the same repo, which newer apt reports as
# a duplicate-source error rather than a warning. Remove it first — the
# deb822 file replaces it, it does not supplement it.
- name: Drop the legacy one-line Tailscale source
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/tailscale.list
    state: absent

- name: Add the Tailscale repo
  ansible.builtin.deb822_repository:
    name: tailscale
    types: [deb]
    uris: "https://pkgs.tailscale.com/stable/ubuntu"
    suites: ["{{ ansible_facts['distribution_release'] }}"]
    components: [main]
    signed_by: "https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_facts['distribution_release'] }}.noarmor.gpg"
    state: present

- name: Install tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true
  # In --check the .sources file above was never actually written, so apt has
  # no Tailscale repo and reports "No package matching 'tailscale'". Nothing
  # is wrong with the node; the simulated run simply cannot see a repo that
  # only a real run would create.
  ignore_errors: "{{ ansible_check_mode }}"

- name: Enable tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started
  # In --check the package was never actually installed, so the unit does not
  # exist yet and the module fails on a simulated absence. Only tolerated in
  # check mode; a real run still fails properly.
  ignore_errors: "{{ ansible_check_mode }}"

- name: Enable forwarding for subnet routing
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "1"
    sysctl_file: /etc/sysctl.d/99-tailscale.conf
    reload: true
  loop: [net.ipv4.ip_forward, net.ipv6.conf.all.forwarding]
  when: tailscale_advertise_routes is defined

- name: Check tailscale state
  ansible.builtin.command: tailscale status --json
  register: ts_status
  changed_when: false
  failed_when: false
  check_mode: false

- name: Bring tailscale up
  ansible.builtin.command:
    argv: >-
      {{
        ['tailscale', 'up',
         '--authkey=' ~ vault_tailscale_authkey,
         '--hostname=' ~ inventory_hostname,
         '--advertise-tags=tag:homelab']
        + (['--advertise-routes=' ~ tailscale_advertise_routes]
           if tailscale_advertise_routes is defined else [])
        + ['--accept-routes=' ~ (tailscale_accept_routes | default(true) | bool | lower)]
      }}
  when: >-
    ts_status.rc != 0 or
    (ts_status.stdout | from_json).BackendState != 'Running'
  register: ts_up
  failed_when: false
  no_log: true

# no_log censors the whole result, cause included, so a failure here arrives as
# 'the command exited with a non-zero return code' and nothing else. The
# registered variable still holds the real output, so report it with the
# authkey substituted out. Redacting one known string beats hiding everything.
- name: Report why tailscale up failed
  ansible.builtin.fail:
    msg: >-
      `tailscale up` failed on {{ inventory_hostname }}
      (rc={{ ts_up.rc }}):
      {{ ((ts_up.stderr | default('')) ~ ' ' ~ (ts_up.stdout | default('')))
         | replace(vault_tailscale_authkey, '<AUTHKEY-REDACTED>') | trim }}
      —
      Common causes: tag:homelab is not defined in the tailnet ACL or the auth
      key is not authorised to apply it; the key has expired or was
      single-use and is already consumed; the key is still the placeholder
      from vault.yaml.example.
  when:
    - ts_up.rc is defined
    - ts_up.rc != 0

# `tailscale up` is skipped on a node that is already Running, so without this
# task a CHANGE to the flags never reaches an existing node — and the whole
# point of tailscale_accept_routes: false is to turn a flag OFF on servers that
# are already up. `tailscale set` reconciles a live node in place and is a
# no-op when the flags already match.
#
# Tailscale's own HA guidance: subnet routers advertising the same route must
# not also accept it, or a standby accepts its own advertised prefix from the
# primary and routes traffic for a directly-connected subnet the long way
# round. Failover between routers is automatic, ~15s, and picks the router
# added to the tailnet earliest — not configurable. deus was added first, so
# it stays primary and opus/sol are passive standbys, which is what we want.
- name: Reconcile tailscale flags on an already-connected node
  ansible.builtin.command:
    argv: >-
      {{
        ['tailscale', 'set',
         '--accept-routes=' ~ (tailscale_accept_routes | default(true) | bool | lower)]
        + (['--advertise-routes=' ~ tailscale_advertise_routes]
           if tailscale_advertise_routes is defined else [])
      }}
  when: >-
    ts_status.rc == 0 and
    (ts_status.stdout | from_json).BackendState == 'Running'
  register: ts_set
  changed_when: false
  failed_when: ts_set.rc is defined and ts_set.rc != 0

# Ansible reports success the moment `tailscale up` returns. The route stays
# inert until it is approved for this node in the admin console, and no
# playbook can assert that (F9).
- name: Remind that advertised routes need console approval
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }} advertises {{ tailscale_advertise_routes }}.
      Approve it under Machines -> {{ inventory_hostname }} -> Subnet routes in
      the Tailscale admin console. Until then the route does not carry traffic.
  when: tailscale_advertise_routes is defined
