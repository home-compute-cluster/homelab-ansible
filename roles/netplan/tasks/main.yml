---
# On every existing node, 50-cloud-init.yaml is NOT a leftover — it is the only
# netplan file and it holds the hand-edited static address. Deleting it before
# a working replacement is in place takes the node off the network, and if that
# happens during `netplan apply` over SSH you lose the session that would let
# you fix it. Hence: write, verify, then remove — never remove first (F12).

- name: Stop cloud-init managing the network
  ansible.builtin.copy:
    dest: /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg
    content: "network: {config: disabled}\n"
    mode: "0644"
    owner: root
    group: root

- name: Look for the cloud-init netplan file
  ansible.builtin.stat:
    path: "{{ netplan_cloud_init_file }}"
  register: netplan_cloud_init

- name: Keep a copy of the pre-existing config
  ansible.builtin.copy:
    src: "{{ netplan_cloud_init_file }}"
    dest: "{{ netplan_backup_file }}"
    remote_src: true
    mode: "0600"
    force: false                     # never overwrite the original snapshot
  when: netplan_cloud_init.stat.exists

# Netplan does not expose nameservers as a fact. Read them out of the live
# config so the template reproduces them rather than guessing, unless the
# inventory has been explicit.
- name: Read the live netplan config
  ansible.builtin.slurp:
    src: "{{ netplan_cloud_init_file }}"
  register: netplan_live_raw
  when: netplan_cloud_init.stat.exists and not netplan_nameservers

- name: Adopt the live nameservers
  ansible.builtin.set_fact:
    netplan_nameservers: >-
      {{ (netplan_live_raw.content | b64decode | from_yaml).network.ethernets[netplan_interface].nameservers.addresses
         | default([], true) }}
    netplan_search: >-
      {{ (netplan_live_raw.content | b64decode | from_yaml).network.ethernets[netplan_interface].nameservers.search
         | default([], true) }}
  when: netplan_live_raw.content is defined

- name: Capture currently rendered network config
  ansible.builtin.shell: |
    set -eu
    netplan generate
    for f in /run/systemd/network/*; do
      [ -e "$f" ] || continue
      printf '### %s\n' "${f##*/}"
      sort "$f"
    done
  register: netplan_before
  changed_when: false
  check_mode: false

# The whole role is one transaction: if the rendered output moves, put the
# cloud-init file back before failing, so a failed run leaves a node that still
# boots onto the network it had.
- name: Swap the netplan config over, with a rollback on any surprise
  block:
    - name: Managed netplan config
      ansible.builtin.template:
        src: 90-homelab.yaml.j2
        dest: "{{ netplan_managed_file }}"
        mode: "0600"        # netplan warns loudly about world-readable configs
        owner: root
        group: root
      register: netplan_template

    - name: Remove the cloud-init file now that ours exists
      ansible.builtin.file:
        path: "{{ netplan_cloud_init_file }}"
        state: absent

    - name: Re-render and compare
      ansible.builtin.shell: |
        set -eu
        netplan generate
        for f in /run/systemd/network/*; do
          [ -e "$f" ] || continue
          printf '### %s\n' "${f##*/}"
          sort "$f"
        done
      register: netplan_after
      changed_when: false
      check_mode: false

    # Telling someone to 'diff the two renders' without handing them the diff
    # is not a diagnosis. Show exactly which lines moved, in both directions.
    - name: Show what actually differs
      ansible.builtin.debug:
        msg:
          lines_only_in_live_config: >-
            {{ netplan_before.stdout_lines | difference(netplan_after.stdout_lines) }}
          lines_only_in_managed_config: >-
            {{ netplan_after.stdout_lines | difference(netplan_before.stdout_lines) }}
      when: netplan_after.stdout != netplan_before.stdout

    # Fails BEFORE anything touches the running network, which is the only
    # case that can lock you out. Because the addresses are not changing, a
    # correct migration renders identically and this assert passes silently.
    - name: Refuse to apply if the rendered config changed
      ansible.builtin.assert:
        that: netplan_after.stdout == netplan_before.stdout
        fail_msg: >-
          Rendered netplan output differs — the template does not reproduce the
          live config on {{ inventory_hostname }}. Nothing has been applied and
          {{ netplan_cloud_init_file }} has been restored from
          {{ netplan_backup_file }}. The task above lists exactly which
          rendered lines differ, in each direction — fix the template to
          account for them, then re-run.

  rescue:
    - name: Restore the cloud-init netplan file
      ansible.builtin.copy:
        src: "{{ netplan_backup_file }}"
        dest: "{{ netplan_cloud_init_file }}"
        remote_src: true
        mode: "0600"
      when: netplan_cloud_init.stat.exists

    - name: Remove the managed file that did not verify
      ansible.builtin.file:
        path: "{{ netplan_managed_file }}"
        state: absent

    - name: Re-fail now that the node is back the way it was
      ansible.builtin.fail:
        msg: >-
          netplan role failed on {{ inventory_hostname }} and rolled back.
          The running network was never touched.

# Reached only when the renders match, i.e. when applying is a no-op on the
# wire. Gated on the file having actually changed: `netplan apply` bounces
# systemd-networkd, and there is no reason to do that over SSH on every re-run
# of site.yaml when nothing moved.
# In check mode the template was never written and 50-cloud-init.yaml was
# never removed, so 'Re-render and compare' compared the live config against
# itself and passed for free. The assert above proves nothing under --check;
# only a real run exercises it.
- name: Warn that the netplan verification did not really run
  ansible.builtin.debug:
    msg: >-
      --check mode: the rendered-config assert compared identical state and
      passed trivially. It has NOT verified that 90-homelab.yaml reproduces
      {{ inventory_hostname }}'s live network config. Run without --check to
      exercise it; the role rolls back if it fails.
  when: ansible_check_mode

- name: Apply
  ansible.builtin.command: netplan apply
  when: netplan_template.changed or netplan_cloud_init.stat.exists
  changed_when: true
