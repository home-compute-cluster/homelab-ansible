---
- name: Update the package index
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Cordon, patch, reboot, uncordon
  block:
    # Cordon before the upgrade, not just before the reboot: an apt upgrade
    # that pulls a new containerd or kernel module can disturb running pods
    # well before anything reboots.
    - name: Cordon the node
      ansible.builtin.command: k3s kubectl cordon {{ inventory_hostname }}
      delegate_to: "{{ groups['k3s_servers'][0] }}"
      when: node_updates_drain | bool
      changed_when: true

    - name: Drain the node
      ansible.builtin.command: >-
        k3s kubectl drain {{ inventory_hostname }}
        --ignore-daemonsets
        --delete-emptydir-data
        --timeout={{ node_updates_drain_timeout }}s
      delegate_to: "{{ groups['k3s_servers'][0] }}"
      when: node_updates_drain | bool
      changed_when: true

    - name: Upgrade packages
      ansible.builtin.apt:
        upgrade: dist
        autoremove: true

    - name: Check whether a reboot is pending
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: node_updates_reboot_required

    - name: Reboot
      ansible.builtin.reboot:
        reboot_timeout: 900
      when:
        - node_updates_reboot | bool
        - node_updates_reboot_required.stat.exists

    - name: Wait for k3s to come back
      ansible.builtin.systemd:
        name: "{{ k3s_service_name }}"
        state: started
        enabled: true

    - name: Wait for the node to report Ready
      ansible.builtin.command: >-
        k3s kubectl wait --for=condition=Ready node/{{ inventory_hostname }} --timeout=600s
      delegate_to: "{{ groups['k3s_servers'][0] }}"
      changed_when: false

  # A node left cordoned after a failed patch run is a node quietly missing
  # from the scheduler for as long as it takes someone to notice.
  always:
    - name: Uncordon the node
      ansible.builtin.command: k3s kubectl uncordon {{ inventory_hostname }}
      delegate_to: "{{ groups['k3s_servers'][0] }}"
      when: node_updates_drain | bool
      changed_when: true
