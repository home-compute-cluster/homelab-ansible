---
# Whether Longhorn runs on this node at all. True means install the host
# dependencies — longhorn-manager and the CSI plugin run on every node in the
# cluster, whether or not that node contributes storage.
longhorn_enabled: false

# Whether this node actually CONTRIBUTES storage, i.e. has a disk with
# allowScheduling=True. A node can be a full Longhorn node and schedule no
# replicas at all; deus is exactly that. Only affects warnings, never actions.
longhorn_scheduling: true

# Longhorn's default-data-path, confirmed on the live cluster. Every replica
# on this node lands under here.
longhorn_data_path: /var/lib/longhorn

# True when longhorn_data_path is expected to be its own filesystem rather
# than a directory on the root disk. Asserted, not created — the disks are
# partitioned and mounted by hand.
longhorn_dedicated_mount: true

# The device expected to be backing longhorn_data_path. Recorded per host and
# ASSERTED, not mounted — so if the wrong disk mounted there, or fstab changed
# under you, the run says so instead of writing replicas onto the wrong drive.
# null means "whatever is mounted there is fine, just report it".
longhorn_disk_device: null
