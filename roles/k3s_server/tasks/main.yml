---
- name: Etcd on a dedicated device
  when: etcd_data_device is truthy
  block:
    - name: Check the etcd device exists
      ansible.builtin.stat:
        path: "{{ etcd_data_device }}"
      register: k3s_etcd_dev

    # Getting this wrong means etcd on the wrong disk, and on sol the wrong
    # disk is a DRAM-less SATA SSD whose fsync latency produces
    # 'apply request took too long' and a flapping leader (F7).
    - name: Assert the etcd device is really there
      ansible.builtin.assert:
        that: k3s_etcd_dev.stat.exists
        fail_msg: >-
          {{ etcd_data_device }} does not exist on {{ inventory_hostname }}.
          Check `lsblk` and correct etcd_data_device in
          inventory/host_vars/{{ inventory_hostname }}.yaml. etcd must land on
          a cached NVMe, never on a DRAM-less or shared disk (F7).

    - name: Read the filesystem on the etcd device
      ansible.builtin.command: blkid -o value -s TYPE {{ etcd_data_device }}
      register: k3s_etcd_fstype
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Check whether the etcd device is already in use
      ansible.builtin.command: findmnt -n -o TARGET --source {{ etcd_data_device }}
      register: k3s_etcd_inuse
      changed_when: false
      failed_when: false
      check_mode: false

    # The inventory naming a device is not evidence the device is free. The
    # design document specified /dev/nvme0n1p3 for sol, which is the LVM
    # physical volume holding the ROOT filesystem, and /dev/nvme1n1p2 for opus,
    # which does not exist while nvme1n1p1 carries Longhorn. Mounting over a
    # device in use writes an fstab entry that can leave the node unbootable,
    # so refuse before touching anything.
    - name: Refuse a device that is already mounted
      ansible.builtin.assert:
        that: k3s_etcd_inuse.stdout | trim | length == 0
        fail_msg: >-
          {{ etcd_data_device }} is already mounted at
          "{{ k3s_etcd_inuse.stdout | trim }}" on {{ inventory_hostname }}.
          Mounting it at {{ k3s_etcd_dir }} would write an fstab entry for a
          device that is in use elsewhere. Set etcd_data_device to a genuinely
          free device, or to null to keep etcd on the OS disk.

    - name: Refuse a device that belongs to LVM or a RAID set
      ansible.builtin.assert:
        that: k3s_etcd_fstype.stdout | trim not in ['LVM2_member', 'linux_raid_member', 'crypto_LUKS']
        fail_msg: >-
          {{ etcd_data_device }} is a {{ k3s_etcd_fstype.stdout | trim }} — it
          is a container for other volumes, not a filesystem to mount. On
          {{ inventory_hostname }} this is almost certainly the disk the root
          filesystem lives on. Set etcd_data_device to null.

    # Never implicit: an unrecognised device is far more likely to be the
    # wrong device than an unformatted one.
    - name: Refuse to format a device that was not opted in
      ansible.builtin.assert:
        that: k3s_etcd_fstype.stdout | trim | length > 0 or (etcd_data_device_format | bool)
        fail_msg: >-
          {{ etcd_data_device }} has no filesystem. Set
          etcd_data_device_format: true in
          inventory/host_vars/{{ inventory_hostname }}.yaml if you really mean
          to mkfs it — that destroys whatever is on the device.

    - name: Create the filesystem
      community.general.filesystem:
        fstype: "{{ etcd_data_device_fstype }}"
        dev: "{{ etcd_data_device }}"
      when:
        - etcd_data_device_format | bool
        - k3s_etcd_fstype.stdout | trim | length == 0

    - name: Mount point
      ansible.builtin.file:
        path: "{{ k3s_etcd_dir }}"
        state: directory
        mode: "0700"
        owner: root
        group: root

    - name: Mount the etcd device
      ansible.posix.mount:
        path: "{{ k3s_etcd_dir }}"
        src: "{{ etcd_data_device }}"
        fstype: "{{ etcd_data_device_fstype }}"
        opts: defaults,noatime
        state: mounted

# A snapshot target that is wrong fails silently: k3s logs the error and
# carries on, so the first time you learn there are no backups is the day you
# need one. Cheap to check here, while it is still a config question.
- name: Confirm the S3 snapshot endpoint is reachable
  ansible.builtin.wait_for:
    host: "{{ etcd_s3_endpoint | regex_replace(':[0-9]+$', '') }}"
    port: "{{ etcd_s3_endpoint | regex_replace('^.*:', '') | int }}"
    timeout: 10
  register: etcd_s3_reachable
  failed_when: false
  when: etcd_s3_verify | bool

- name: Assert the S3 snapshot endpoint answered
  ansible.builtin.assert:
    that: not etcd_s3_reachable.failed | default(false)
    fail_msg: >-
      {{ etcd_s3_endpoint }} did not answer from {{ inventory_hostname }}.
      etcd snapshots would fail silently. Check Garage is up on nebula, or set
      etcd_s3_verify: false to proceed without snapshots.
  when: etcd_s3_verify | bool

- name: Etcd snapshot credentials drop-in
  ansible.builtin.template:
    src: etcd-s3.yaml.j2
    dest: "{{ k3s_config_drop_in_dir }}/etcd-s3.yaml"
    mode: "0600"
    owner: root
    group: root
  notify: Restart k3s

- name: Static pod manifest directory
  ansible.builtin.file:
    path: "{{ k3s_pod_manifest_dir }}"
    state: directory
    mode: "0755"
    owner: root
    group: root
  when: kube_vip_enabled | bool

- name: kube-vip static pod
  ansible.builtin.template:
    src: kube-vip.yaml.j2
    dest: "{{ k3s_pod_manifest_dir }}/kube-vip.yaml"
    mode: "0644"
    owner: root
    group: root
  when: kube_vip_enabled | bool

- name: Enable and start k3s
  ansible.builtin.systemd:
    name: k3s
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for the local API server to answer
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 6443
    timeout: 300

- name: Wait for this node to report Ready
  ansible.builtin.command: >-
    k3s kubectl wait --for=condition=Ready node/{{ inventory_hostname }} --timeout=300s
  changed_when: false
  retries: 3
  delay: 10
  register: k3s_node_ready
  until: k3s_node_ready.rc == 0
