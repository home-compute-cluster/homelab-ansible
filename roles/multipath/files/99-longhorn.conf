# Managed by Ansible (roles/multipath). Do not hand-edit.
#
# multipathd claims Longhorn's block devices as multipath paths, which makes
# the volume unmountable and shows up as
# "failed to get device path: device is a multipath device". Longhorn's
# troubleshooting docs blacklist the devnodes rather than disabling
# multipathd, so a node that later gains real multipath hardware still works.
blacklist {
    devnode "^sd[a-z0-9]+"
}
