---
# kube-prom already runs node-exporter with --collector.hwmon,
# --collector.thermal_zone and --collector.rapl. Those read sysfs and produce
# nothing until lm-sensors has run sensors-detect and loaded the right
# modules — so empty thermal panels on a new node are an OS gap, not a
# Prometheus one (F10).
- name: Install health/power tooling
  ansible.builtin.apt:
    name:
      - lm-sensors        # populates hwmon
      - smartmontools     # the actual disk-failure early warning
      - nvme-cli          # NVMe wear + temp that smartctl can miss
      - powertop
      - linux-tools-common
      - linux-tools-generic
    state: present

- name: Detect sensors non-interactively
  ansible.builtin.command: sensors-detect --auto
  args:
    creates: /etc/modules-load.d/lm-sensors.conf

- name: Enable smartd
  ansible.builtin.systemd:
    name: smartd
    enabled: true
    state: started
  # In --check the package was never actually installed, so the unit does not
  # exist yet and the module fails on a simulated absence. Only tolerated in
  # check mode; a real run still fails properly.
  ignore_errors: "{{ ansible_check_mode }}"

- name: Textfile collector directory
  ansible.builtin.file:
    path: /var/lib/node_exporter/textfile_collector
    state: directory
    mode: "0755"

- name: SMART exporter script
  ansible.builtin.copy:
    src: smart-textfile.sh
    dest: /usr/local/bin/smart-textfile.sh
    mode: "0755"
    owner: root
    group: root
  register: node_health_script

- name: SMART collector units
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
    owner: root
    group: root
  loop:
    - smart-textfile.service
    - smart-textfile.timer
  register: node_health_units

- name: Enable timer
  ansible.builtin.systemd:
    name: smart-textfile.timer
    enabled: true
    state: started
    daemon_reload: true

# The units are on disk and the timer runs, but nothing scrapes the output
# until node-exporter is told where to look. Verified on the live cluster
# 2026-08-30: the kube-prom node-exporter DaemonSet carries hwmon,
# thermal_zone and rapl but NOT --collector.textfile.directory, and mounts no
# textfile volume. That change belongs on ArgoCD's side of the boundary.
- name: Note the matching GitOps change
  ansible.builtin.debug:
    msg: >-
      smart.prom is being written on {{ inventory_hostname }}, but
      kube-prom-prometheus-node-exporter has no
      --collector.textfile.directory=/host/textfile and no hostPath mount for
      /var/lib/node_exporter/textfile_collector. Until that lands in
      apps/monitoring/values-monitoring.yaml these metrics are not scraped.
  run_once: true
