---
# DEFERRED for opus and sol (§7). Adding storage nodes changes Longhorn's
# replica scheduling, and that is its own change with LonghornVolumeDegraded
# quiet before and after — not something to fold into the HA window.
#
# Verified on the live cluster 2026-08-30: Longhorn's
# create-default-disk-labeled-nodes setting is FALSE, which means Longhorn
# creates a default disk under /var/lib/longhorn on EVERY node that joins,
# whether or not this role runs. Joining opus and sol therefore makes them
# storage nodes on their OS disks by default. The node.longhorn.io/
# create-default-disk=false label in their host_vars only takes effect once
# that setting is flipped to true on the GitOps side.
- name: Warn that new nodes become Longhorn storage nodes automatically
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }} has longhorn_enabled false, but Longhorn's
      create-default-disk-labeled-nodes is false cluster-wide, so Longhorn
      will still create a default disk on /var/lib/longhorn here. To actually
      defer this, set create-default-disk-labeled-nodes: true in the Longhorn
      values on the ArgoCD side before Phase 4.
  when: not (longhorn_enabled | bool)

- name: Dedicated Longhorn disk
  when:
    - longhorn_enabled | bool
    - longhorn_disk_device is truthy
  block:
    - name: Check the Longhorn device exists
      ansible.builtin.stat:
        path: "{{ longhorn_disk_device }}"
      register: longhorn_dev

    - name: Assert the Longhorn device is really there
      ansible.builtin.assert:
        that: longhorn_dev.stat.exists
        fail_msg: >-
          {{ longhorn_disk_device }} does not exist on {{ inventory_hostname }}.
          Check `lsblk` and correct longhorn_disk_device in
          inventory/host_vars/{{ inventory_hostname }}.yaml.

    - name: Read the filesystem on the Longhorn device
      ansible.builtin.command: blkid -o value -s TYPE {{ longhorn_disk_device }}
      register: longhorn_fstype
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Refuse to format a device that was not opted in
      ansible.builtin.assert:
        that: longhorn_fstype.stdout | trim | length > 0 or (longhorn_disk_format | bool)
        fail_msg: >-
          {{ longhorn_disk_device }} has no filesystem. Set
          longhorn_disk_format: true for {{ inventory_hostname }} only if you
          mean to destroy what is on it.

    - name: Create the filesystem
      community.general.filesystem:
        fstype: "{{ longhorn_disk_fstype }}"
        dev: "{{ longhorn_disk_device }}"
      when:
        - longhorn_disk_format | bool
        - longhorn_fstype.stdout | trim | length == 0

    - name: Mount point
      ansible.builtin.file:
        path: "{{ longhorn_disk_mount_root }}/{{ longhorn_disk_device | basename }}"
        state: directory
        mode: "0755"

    - name: Mount the Longhorn disk
      ansible.posix.mount:
        path: "{{ longhorn_disk_mount_root }}/{{ longhorn_disk_device | basename }}"
        src: "{{ longhorn_disk_device }}"
        fstype: "{{ longhorn_disk_fstype }}"
        opts: defaults,noatime
        state: mounted

    # Ansible's job stops at the mount. Registering the path as a Longhorn
    # disk is a Node CR change and belongs to ArgoCD.
    - name: Note the remaining GitOps step
      ansible.builtin.debug:
        msg: >-
          {{ longhorn_disk_device }} is mounted at
          {{ longhorn_disk_mount_root }}/{{ longhorn_disk_device | basename }}.
          Add it as a disk on the {{ inventory_hostname }} Longhorn Node
          resource to make it schedulable.
